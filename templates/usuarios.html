<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Usuarios | CinePlus</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>

<body>

<div class="container mt-5 mb-5">

<div class="page-card">

<div class="page-header">

<h2 class="mb-0">
Catálogo de Usuarios
</h2>

</div>

<div class="page-body">

<div class="row-crud">

<!-- FORMULARIO -->

<div class="left-panel">

<div class="crud-form">

<h4 class="crud-title">
Nuevo Usuario
</h4>

<form action="/guardar_usuario" method="POST">

<div class="mb-3">

<label class="form-label">
Usuario
</label>

<input
type="text"
name="usuario"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">
Contraseña
</label>

<input
type="password"
name="clave"
class="form-control"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-primary-custom">

Guardar Usuario

</button>

</div>

</form>

</div>

</div>

<!-- TABLA -->

<div class="right-panel">

<div class="crud-table">

<h4 class="crud-title">
Usuarios Registrados
</h4>

<table class="table table-hover align-middle">

<thead>

<tr>

<th>ID</th>
<th>Usuario</th>
<th style="width:180px;">Acciones</th>

</tr>

</thead>

<tbody>

{% for usuario in usuarios %}

<tr>

<td>{{ usuario[0] }}</td>

<td>{{ usuario[1] }}</td>

<td>

<a
href="/EditarUsuario/{{ usuario[0] }}"
class="btn btn-warning btn-sm">

Editar

</a>

<a
href="/eliminar_usuario/{{ usuario[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('¿Deseas eliminar este usuario?')">

Eliminar

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

<div class="text-center mt-4">

<a
href="/dashboard"
class="btn btn-secondary-custom">

Regresar 

</a>

</div>

</div>

</div>

</div>

</body>

</html>
