<!DOCTYPE html>

<html>
<head>
    <title>Usuarios</title>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body class="bg-light">

<div class="container mt-4">

<div class="card shadow-lg">

    <div class="card-header text-white"
         style="background-color:#8FAF3D;">

        <h2>Catálogo de Usuarios</h2>

    </div>

    <div class="card-body">

        <h4>Nuevo Usuario</h4>

        <form action="/guardar_usuario" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="clave"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn text-white"
                style="background-color:#8FAF3D;">

                Guardar

            </button>

        </form>

        <hr>

        <table class="table table-striped table-hover table-bordered">

            <thead class="table-success">

                <tr>

                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

            {% for usuario in usuarios %}

                <tr>
                    <td>{{ usuario[0] }}</td>
                    <td>{{ usuario[1] }}</td>
                    <td>

                        <a href="/EditarUsuario/{{ usuario[0] }}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a href="/eliminar_usuario/{{ usuario[0] }}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Deseas eliminar este usuario?')">
                            Eliminar
                        </a>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

        <a href="/dashboard"
           class="btn text-white"
           style="background-color:#8FAF3D;">

            Regresar

        </a>

    </div>

</div>
</div>
</body>
</html>
