<!DOCTYPE html>

<html>

<head>


<title>Películas</title>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body class="bg-light">

<div class="container mt-4">


<div class="card shadow-lg">

    <div class="card-header text-white"
         style="background-color:#8FAF3D;">

        <h2>Catálogo de Películas</h2>

    </div>

    <div class="card-body">

        <h4>Nueva Película</h4>

        <form action="/GuardarPelicula" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Título
                </label>

                <input
                    type="text"
                    name="titulo"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Género
                </label>

                <input
                    type="text"
                    name="genero"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn text-white"
                style="background-color:#8FAF3D;">

                Guardar

            </button>

        </form>

        <hr>

        <table class="table table-striped table-hover table-bordered">

            <thead class="table-success">

                <tr>

                    <th>ID</th>
                    <th>Título</th>
                    <th>Género</th>
                    <th>Acciones</th>

                </tr>

            </thead>
            <tbody>

            {% for pelicula in peliculas %}

                <tr>

                    <td>{{ pelicula[0] }}</td>
                    <td>{{ pelicula[1] }}</td>
                    <td>{{ pelicula[2] }}</td>

                    <td>

                        <a href="/EditarPelicula/{{ pelicula[0] }}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a href="/EliminarPelicula/{{ pelicula[0] }}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Deseas eliminar esta película?');">
                            Eliminar
                        </a>

                    </td>
                </tr>
            {% endfor %}
            </tbody>

        </table>

        <br>

        <a href="/dashboard"
           class="btn text-white"
           style="background-color:#8FAF3D;">
            Regresar
        </a>

    </div>

</div>
</div>
</body>
</html>
