<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Películas | CinePlus</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>

<body>

<div class="container mt-5 mb-5">

<div class="page-card">

<div class="page-header">

<h2 class="mb-0">
Catálogo de Películas
</h2>

</div>

<div class="page-body">

<div class="row-crud">

<!-- FORMULARIO -->

<div class="left-panel">

<div class="crud-form">

<h4 class="crud-title">
Nueva Película
</h4>

<form action="/GuardarPelicula" method="POST">

<div class="mb-3">

<label class="form-label">
Título
</label>

<input
type="text"
name="titulo"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">
Género
</label>

<input
type="text"
name="genero"
class="form-control"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-primary-custom">

Guardar Película

</button>

</div>

</form>

</div>

</div>

<!-- TABLA -->

<div class="right-panel">

<div class="crud-table">

<h4 class="crud-title">
Películas Registradas
</h4>

<table class="table table-hover align-middle">

<thead>

<tr>

<th>ID</th>
<th>Título</th>
<th>Género</th>
<th style="width:180px;">Acciones</th>

</tr>

</thead>

<tbody>

{% for pelicula in peliculas %}

<tr>

<td>{{ pelicula[0] }}</td>

<td>{{ pelicula[1] }}</td>

<td>{{ pelicula[2] }}</td>

<td>

<a
href="/EditarPelicula/{{ pelicula[0] }}"
class="btn btn-warning btn-sm">

Editar

</a>

<a
href="/EliminarPelicula/{{ pelicula[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('¿Deseas eliminar esta película?');">

Eliminar

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

<div class="text-center mt-4">

<a
href="/dashboard"
class="btn btn-secondary-custom">

Regresar

</a>

</div>

</div>

</div>

</div>

</body>

</html>
