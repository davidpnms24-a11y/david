<!DOCTYPE html>

<html>
<head>
    <title>Login CinePlus</title>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-white">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

    <div class="col-md-4">

        <div class="card shadow-lg">

            <div class="card-header text-white text-center"
                 style="background-color:#7cc13c;">

                <h2>CinePlus</h2>

                <p>Iniciar Sesión</p>

            </div>

            <div class="card-body">

                <form action="/validar" method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="usuario"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="clave"
                            class="form-control"
                            required>

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn text-white"
                            style="background-color:#7cc13c;">

                            Entrar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
</div>
</body>
</html>
