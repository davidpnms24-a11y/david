<!DOCTYPE html>

<html>
<head>
    <title>Configuración</title>


<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body class="bg-light">

<div class="container mt-5">


<div class="card shadow-lg">

    <div class="card-header text-white"
         style="background-color:#8FAF3D;">

        <h2>Configuración del Sistema</h2>

    </div>

    <div class="card-body">

        <form action="/ActualizarConfiguracion" method="POST">

            <input
                type="hidden"
                name="id"
                value="{{ configuracion[0] }}">

            <div class="mb-3">

                <label class="form-label">
                    Minutos del Token
                </label>

                <input
                    type="number"
                    name="minutos"
                    value="{{ configuracion[1] }}"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn text-white"
                style="background-color:#8FAF3D;">

                Guardar

            </button>

            <a href="/dashboard"
               class="btn btn-secondary">

                Regresar

            </a>

        </form>

    </div>

    <div class="card-footer text-center">

        Sistema de Administración CinePlus

    </div>

</div>
</div>
</body>
</html>
