<!DOCTYPE html>

<html>
<head>
    <title>Editar Usuario</title>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body class="bg-light">

<div class="container mt-5">

<div class="card shadow-lg">

    <div class="card-header text-white"
         style="background-color:#8FAF3D;">

        <h2>Editar Usuario</h2>

    </div>

    <div class="card-body">

        <form action="/ActualizarUsuario" method="POST">

            <input
                type="hidden"
                name="id"
                value="{{ usuario[0] }}">

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="usuario"
                    value="{{ usuario[1] }}"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Nueva Contraseña
                </label>

                <input
                    type="password"
                    name="clave"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn text-white"
                style="background-color:#8FAF3D;">

                Actualizar

            </button>

            <a href="/usuarios"
               class="btn btn-secondary">

                Regresar

            </a>

        </form>

    </div>

</div>
</div>
</body>
</html>
