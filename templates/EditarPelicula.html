<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Editar Película | CinePlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <div class="container mt-5">

        <div class="page-card">

            <div class="page-header">
                <h2 class="mb-0">Editar Película</h2>
            </div>

            <div class="page-body">

                <div class="row justify-content-center">

                    <div class="col-lg-6">

                        <div class="crud-form">

                            <form action="/ActualizarPelicula" method="POST">

                                <input
                                    type="hidden"
                                    name="id"
                                    value="{{ pelicula[0] }}">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Título
                                    </label>

                                    <input
                                        type="text"
                                        name="titulo"
                                        value="{{ pelicula[1] }}"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label">
                                        Género
                                    </label>

                                    <input
                                        type="text"
                                        name="genero"
                                        value="{{ pelicula[2] }}"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="d-grid gap-2">

                                    <button
                                        type="submit"
                                        class="btn btn-primary-custom">
                                        Actualizar Película
                                    </button>

                                    <a
                                        href="/peliculas"
                                        class="btn btn-secondary-custom">
                                        Regresar
                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
